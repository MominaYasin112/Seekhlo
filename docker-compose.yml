# Full stack local setup: docker compose up
# Then: cd frontend && npm run dev

services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    environment:
      POSTGRES_USER: seekhlo
      POSTGRES_PASSWORD: seekhlo123
      POSTGRES_DB: seekhlo
    ports:
      - "5432:5432"
    volumes:
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  redis:
    image: redis:7
    platform: linux/amd64
    ports:
      - "6379:6379"

  ml-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./ml-service:/app
    command: sh -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"

  code-runner:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./code-runner:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8002"
    ports:
      - "8002:8002"
